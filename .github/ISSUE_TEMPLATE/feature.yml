name: Feature Request
description: While we cannot guarantee implementation we are eager to here your suggestions.
type: Feature
labels: [Triage]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I believe my feature request to be for the benefit of a larger audience and not serve a niche case for me.
          required: true
        - label: I checked that my feature is new and that it has not been implemented in a newer release.
          required: true
        - label: My feature is not related to the behaviour of a specific package or product provided by neo42.
          required: true
        - label: I understand that feature requests created in this repository are not subject to any support agreements made with neo42.
          required: true
  - type: markdown
    attributes:
      value: |
        <sub>If you need help with neo42 products please consider contacting us at [neosupport@neo42.de](mailto:neosupport@neo42.de).</sub>
  - type: textarea
    id: feature
    attributes:
      label: Description
      placeholder: Please describe the improvement or feature in full. What problems are you about to solve, or how does it imporve the toolkit.
  - type: textarea
    attributes:
      label: Proposed technical implementation details (optional).
      placeholder: A clear and concise description of what you want to happen. Consider providing an example PowerShell experience with expected result.

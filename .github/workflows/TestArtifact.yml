name: Test Artifact

on:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.shell }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: checkout-tests
        uses: actions/checkout@v7

      - name: download-artifact
        id: download-artifact-test
        uses: actions/download-artifact@v8
        with:
          path: build

      - name: install-required-modules
        run: ./.tools/Install-RequiredModule.ps1 -ModulesOnly

      - name: run-pester
        run: ./.tools/Invoke-PesterTest.ps1 -ModuleDirectory '${{ steps.download-artifact-test.outputs.download-path }}' -PesterTestDirectory './tests/pester' -CompatibilityTestDirectory (Get-Item -Path "./src/modules/Neo42.Extensions*")

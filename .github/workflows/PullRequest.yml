name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - production

jobs:
  artifact:
    uses: ./.github/workflows/CreateArtifact.yml
    with:
      PSADT_VERSION: ${{ vars.TARGET_PSADT_VERSION }}
    permissions:
      contents: read

  test:
    needs: artifact
    uses: ./.github/workflows/TestArtifact.yml
    permissions:
      contents: read


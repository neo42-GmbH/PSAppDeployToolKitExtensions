name: Post Release

on:
  release:
    types:
      - released

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: checkout-extensions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: ./Source

      - name: reply-to-and-close-issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ github.event.release.tag_name }}'
            const isoDate = new Date().toISOString();

            if (milestone) {
              await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestone.number,
                title: tag,
                due_on: isoDate,
                state: 'closed'
              });
            }
            else {
              throw new Error('Milestone not found');
            }

            // Create a new milestone for the next release
            await github.rest.issues.createMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Next',
              description: 'The next release',
            });

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              milestone: milestone.number
            });

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `:tada: This issue will be addressed in version ${tag} :tada:
            Once the release is published, it will be available on:
              * [GitHub release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag})

            <sub>This is an auto-generated message from your friendly release assistant :package::rocket:</sub>`
              });

              if (issue.state !== 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }

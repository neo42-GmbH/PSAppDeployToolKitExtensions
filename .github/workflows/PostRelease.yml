name: Post Release

on:
  release:
    types:
      - released

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: checkout-extensions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: ./Source

      - name: reply-to-and-close-issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ github.event.release.tag_name }}';

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            });

            // Find the milestone for the current release. It is already renamed if this run is repeated.
            let milestone = milestones.find(m => m.title === tag);
            if (!milestone) {
              milestone = milestones.find(m => m.title === 'Next' && m.state === 'open');
              if (!milestone) {
                throw new Error('Milestone not found');
              }
            }

            // Collect the issues before modifying the milestone, as the milestone filter may lag behind a rename/close.
            // The issues endpoint also returns pull requests, which are skipped.
            const issues = (
              await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: milestone.number,
                state: 'open'
              })
            ).filter(issue => !issue.pull_request);

            // Rename and close the milestone for the current release
            if (milestone.title !== tag) {
              ({ data: milestone } = await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestone.number,
                title: tag,
                description: `Release ${tag} built from commit [${context.sha}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                due_on: new Date().toISOString(),
                state: 'closed'
              }));
            }

            // Create a new milestone for the next release
            if (!milestones.some(m => m.title === 'Next' && m.number !== milestone.number)) {
              await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Next',
                description: 'The next release'
              });
            }

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `:tada: This issue will be addressed in ${tag} :tada:
            Once the release is published, it will be available on:
              * [GitHub release](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag})

            <sub>This is an auto-generated message from your friendly release assistant :package::rocket:</sub>`
              });

              if (issue.state !== 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
